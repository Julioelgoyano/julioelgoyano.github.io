name: Transmitir En Vivo (Varios Videos)

on:
  workflow_dispatch:

jobs:
  transmitir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Crear lista de videos y transmitir
        env:
          RTMP_TARGET: ${{ secrets.RTMP_TARGET }}
        run: |
          # Detecta todos los .mp4 en la raíz del repositorio y los anota en lista.txt
          for f in *.mp4; do echo "file '$PWD/$f'" >> lista.txt; done
          
          # Transmite la lista completa en bucle infinito hacia tu servidor
          ffmpeg -re -stream_loop -1 -f concat -safe 0 -i lista.txt -c:v copy -c:a aac -f flv "$RTMP_TARGET"
