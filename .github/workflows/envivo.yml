name: Transmitir En Vivo O-Plus TV

on:
  workflow_dispatch:

jobs:
  transmitir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar FFmpeg y fuentes
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Crear lista de videos y transmitir
        env:
          RTMP_TARGET: ${{ secrets.RTMP_TARGET }}
          TZ: "America/Caracas"
        run: |
          # Detecta todos los .mp4 en la raíz del repositorio y los anota en lista.txt
          : > lista.txt
          for f in *.mp4; do echo "file '$PWD/$f'" >> lista.txt; done

          # Texto del ticker en un archivo (evita problemas con acentos, corchetes y comillas)
          LISTA_CANALES="  GUÍA DE CANALES O-PLUS TV:   [2] TL+ (Anime)   •   [3] TL+ Santa Ana (Entretenimiento)   •   [4] Primired (OFICIAL)   •   [5] CN City (Animación)   •   [6] Optiradio FM (Musical)   •   [7] Optiradio TV (OptiMovies)   •   Disfruta la señal en oplustv.github.io   •  "
          printf '%s' "$LISTA_CANALES" > ticker.txt

          # Fondo 1280x720:
          #  - video en el rectángulo central (493,135 | 752x450)
          #  - ticker en la barra superior (467,19 | 796x37)
          #  - mensajes rotativos en el rectángulo inferior izquierdo (489,601 | 434x106)
          #  - reloj y fecha en el rectángulo inferior derecho (952,598 | 293x104)
          ffmpeg -re -stream_loop -1 -f concat -safe 0 -i lista.txt \
            -loop 1 -framerate 30 -i background.png \
            -filter_complex "\
              [1:v]scale=1280:720,split=2[base][raw]; \
              [raw]crop=796:37:467:19,drawtext=\
                fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:\
                textfile=ticker.txt:\
                fontcolor=white:\
                fontsize=24:\
                y=(h-text_h)/2:\
                x=w-mod(t*110\,w+text_w)[ticker]; \
              [0:v]scale=752:450:force_original_aspect_ratio=decrease,pad=752:450:(ow-iw)/2:(oh-ih)/2:black,setsar=1[vid]; \
              [base][vid]overlay=493:135[tmp1]; \
              [tmp1][ticker]overlay=467:19[tmp2]; \
              [tmp2]drawtext=\
                fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:\
                text='Estás viendo O-Plus TV':\
                enable='between(mod(t\,30)\,0\,10)':\
                fontcolor=white:fontsize=28:\
                x=489+(434-text_w)/2:y=601+(106-text_h)/2,\
              drawtext=\
                fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:\
                text='Anime en TL+ canal 2':\
                enable='between(mod(t\,30)\,10\,20)':\
                fontcolor=white:fontsize=28:\
                x=489+(434-text_w)/2:y=601+(106-text_h)/2,\
              drawtext=\
                fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:\
                text='Hecho con cariño':\
                enable='between(mod(t\,30)\,20\,30)':\
                fontcolor=white:fontsize=28:\
                x=489+(434-text_w)/2:y=601+(106-text_h)/2,\
              drawtext=\
                fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:\
                text='%{localtime\:%H\:%M}':\
                fontcolor=white:fontsize=48:\
                x=952+(293-text_w)/2:y=598+18,\
              drawtext=\
                fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:\
                text='%{localtime\:%d/%m/%Y}':\
                fontcolor=white:fontsize=22:\
                x=952+(293-text_w)/2:y=598+72,\
              format=yuv420p[final]" \
            -map "[final]" -map 0:a? \
            -c:v libx264 -preset veryfast -b:v 3500k -maxrate 3500k -bufsize 7000k -g 60 -r 30 \
            -c:a aac -b:a 128k -ar 44100 \
            -f flv "$RTMP_TARGET"
